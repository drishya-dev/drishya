name: ci

on:
  # Run once for a finished candidate, after local checks; commits do not spend hosted minutes.
  workflow_dispatch:
    inputs:
      checks_only:
        description: 'Only platform type/unit/package checks (targeted verification, not a full gate)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Packaging rebuilds the UI and checks the installed tarball.
      - run: pnpm package:verify
      # The committed demo bundle must match what the fixtures produce.
      - run: pnpm demo:bundle && git diff --exit-code -- apps/ui/public/demo/bundle.json
        shell: bash

  browser:
    if: ${{ !inputs.checks_only }}
    env:
      DRISHYA_WORKERS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:browser
      # Keep Playwright's page snapshot when a browser test fails, so a CI-only failure can be
      # diagnosed. The browser tests use synthetic data only.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
