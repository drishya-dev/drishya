name: ci

# SHIP-16. Windows, Linux and macOS on Node 24 with a frozen install. docs/CI_POLICY.md has the cost rules.
#
# While the repository is private, hosted minutes are metered, so a push or a pull request starts this workflow
# but every job is skipped (a skipped job uses no runner and no minutes); only a builder's manual dispatch runs it.
# The moment the repository is public the same triggers run it for free, with no edit here: each job's `if` reads
# `github.event.repository.private`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks_only:
        description: 'Only the platform checks (typecheck, units, builds, security, package); skip the browser suite'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit (the same ones release.yml uses), not a movable tag.
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    name: check (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # The lockfile is frozen: a changed dependency fails here instead of being resolved anew.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ui:build
      - run: pnpm --filter drishya-site build
      - run: pnpm test:security
      # Builds the package, checks its contents, installs the packed tarball offline, records every network
      # attempt of the installed server, and runs the security suite again against that install.
      - run: pnpm package:verify
      # The committed demo bundle must match what the fixtures produce.
      - run: pnpm demo:bundle && git diff --exit-code -- apps/ui/public/demo/bundle.json
        shell: bash

  browser:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.repository.private == false) && !inputs.checks_only }}
    name: browser (${{ matrix.os }})
    # macOS runs one browser at a time: its hosted runner is the smallest, and two workers there produced
    # load-timing failures in a different spec on most runs (17 Nov, before 0.1.0). Slower, but a red run means a bug.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 120 || 75 }}
    env:
      DRISHYA_WORKERS: ${{ matrix.os == 'macos-latest' && 1 || 2 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Linux needs Chromium's system libraries as well as the browser; the flag is harmless elsewhere.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # Keep Playwright's page snapshot when a browser test fails, so a CI-only failure can be
      # diagnosed. The browser tests use synthetic data only.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
