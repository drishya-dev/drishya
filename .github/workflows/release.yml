name: release

# SEC-5. Publishing with npm provenance, configured and NOT run. Nothing publishes from a push or a pull
# request: only a builder starting this workflow by hand, with `publish` ticked, after docs/release-checklist.md
# is complete. REL-4: an agent never publishes.
#
# Provenance needs no stored secret: npm "trusted publishing" accepts this workflow's short-lived OpenID Connect
# identity. The builders set it up once on npmjs.com (package settings, Trusted publisher: repository
# drishya-dev/drishya, workflow release.yml, environment npm-release). Until then the publish job fails closed.
#
# Actions are pinned to a full commit, not a movable tag, so a moved tag cannot change what runs here.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (leave off for a dry run that builds and verifies only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # The lockfile is frozen: a changed dependency fails here instead of being resolved anew.
      - run: pnpm install --frozen-lockfile
      # Builds the package, checks its contents against the allowlist, installs the tarball offline,
      # records every network attempt of the packed server, and runs the security suite.
      - run: pnpm package:verify
      - run: pnpm audit
      - run: npm pack --dry-run --json --ignore-scripts
        working-directory: dist/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: dist/package
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # the OpenID Connect identity npm uses for trusted publishing and provenance
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: package
      # Provenance ties the tarball to this run and this commit; an install script cannot run on publish.
      - run: npm publish ./package --provenance --access public --ignore-scripts
