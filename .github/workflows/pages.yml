name: pages

# Deploys the landing site (apps/site) to GitHub Pages at https://drishya-dev.github.io/drishya/.
# One-time setup, by a repository admin: Settings > Pages > Source: GitHub Actions. This workflow never changes settings.
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'apps/ui/public/**'
      - 'scripts/build-site.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# One deploy at a time, and a newer push replaces a queued one. A deploy already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to a full commit, not a movable tag (SEC-5, as in ci.yml and release.yml).
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: pnpm install --frozen-lockfile
      # A project page is served under /drishya/, so the site is built with that base (vite.config.ts reads SITE_BASE).
      - run: pnpm --filter drishya-site build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
