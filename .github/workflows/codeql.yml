name: codeql

# SEC-4b. GitHub code scanning with the `security-extended` query suite for the source and the workflow files.
#
# Like ci.yml, every job is skipped while the repository is private (a skipped job uses no runner and no minutes,
# see docs/CI_POLICY.md); the moment it is public the same triggers run it, free on standard runners, with no edit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Nothing is written to the repository; each job adds only the right to upload its code-scanning results.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The action is pinned to a full commit (v4.39.3), not a movable tag.
jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.private == false }}
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
