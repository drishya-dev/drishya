name: Idea or feature
description: Propose something Drishya should do or show
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, slow or impossible today? Start from the developer's situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: For anything visual, say where it lives on screen and what its motion would mean.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the principles
      description: See docs/VISION.md and AGENTS.md.
      options:
        - label: Capture is passive and session control requires explicit consent
        - label: It shows captured evidence, or clearly labels what is derived
        - label: Any motion carries information about origin, connection or change
  - type: textarea
    id: acceptance
    attributes:
      label: How we can verify it
      description: Optional. What should be true once it is built, and any specific cases or constraints. Say here if you want to build it yourself.
