<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sacred Timeline</title>
<!--
  GIT-1 prototype (docs/review/124-sacred-timeline-git-graph.md, build order step 1).
  Synthetic topology only: main plus four branches, two merged, two unmerged. Nothing here is real repository data.
  WebGL2 draws light only (filaments, commit points, stars) into a half-float buffer with additive blending, then a
  three-level bloom and a tone map. Every character is DOM. Variants: 1 River · 2 Ice · 3 Storm, or ?v=river|ice|storm.
  ?lite=1 halves the filaments and turns bloom off (the low-resource budget).
-->
<style>
  :root { --bg: #03050b; --t1: #e9eefb; --t2: #a3adc6; --t3: #66708a; --line: rgba(170, 190, 240, .14); --focus: #8fd8ff; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--t1); font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: fixed; left: 16px; top: 16px; z-index: 3; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: rgba(5, 8, 16, .72); backdrop-filter: blur(8px); }
  .bar button { padding: 6px 11px; border: 0; border-radius: 7px; background: none; color: var(--t2); font: 500 12px/1 inherit; cursor: pointer; transition: color 150ms ease, background-color 150ms ease, transform 120ms ease; }
  .bar button:hover { color: var(--t1); }
  .bar button:active { transform: scale(.97); }
  .bar button[aria-pressed=true] { color: var(--t1); background: rgba(150, 175, 240, .12); }
  .bar button:focus-visible, .commit:focus-visible { outline: 1px solid var(--focus); outline-offset: 2px; }
  .layer { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .commit { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; padding: 0; border: 0; border-radius: 50%; background: transparent; pointer-events: auto; cursor: pointer; }
  .ref { position: absolute; transform: translate(12px, -50%); font: 11px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--t2); white-space: nowrap; letter-spacing: .01em; }
  .ref.main { color: var(--t1); }
  .ref.below { transform: translate(-50%, 14px); }
  .peek { position: absolute; z-index: 4; width: 260px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(7, 10, 20, .9); backdrop-filter: blur(10px); color: var(--t1); pointer-events: none; opacity: 0; transform: translateY(4px) scale(.98); transform-origin: top left; transition: opacity 160ms cubic-bezier(.23,1,.32,1), transform 160ms cubic-bezier(.23,1,.32,1); }
  .peek.open { opacity: 1; transform: none; }
  .peek b { display: block; margin-bottom: 4px; font-weight: 500; }
  .peek small { display: block; color: var(--t2); font: 11px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .note { position: fixed; left: 16px; bottom: 14px; z-index: 3; color: var(--t3); font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { .peek, .bar button { transition: none; } }
</style>
</head>
<body>
<canvas id="light" aria-hidden="true"></canvas>
<nav class="bar" aria-label="Variant"></nav>
<div class="layer" id="layer" role="group" aria-label="Commits"></div>
<div class="peek" id="peek" role="status"></div>
<div class="note">Synthetic topology · main + 4 branches (2 merged, 2 unmerged) · arrows move between commits</div>
<script>
'use strict';
const VARIANTS = {
  // Spectral river: violet and magenta rims, cyan core; medium braid; lightning two levels deep.
  river: { label: 'River', main: 420, width: 44, braid: .42, hair: .04, alpha: [.025, .07], twist: 1.3, tipDepth: 2, bloom: .9, exposure: 1.3,
    palette: ['#ff4fd8', '#9a5cff', '#5f8dff', '#3fe6ff', '#a8e4ff', '#7f5cff', '#ff5ccf'] },
  // Ice: fewer, finer filaments, near-white and cyan; more hair, quieter bloom.
  ice: { label: 'Ice', main: 300, width: 36, braid: .34, hair: .07, alpha: [.03, .08], twist: .8, tipDepth: 2, bloom: .65, exposure: .95,
    palette: ['#6f7dff', '#86c2ff', '#d2f1ff', '#55e2ff', '#d2f1ff', '#86c2ff', '#6f7dff'] },
  // Storm: dense, strongly braided, magenta-heavy; lightning three levels deep and more angular.
  storm: { label: 'Storm', main: 520, width: 50, braid: .55, hair: .035, alpha: [.022, .065], twist: 1.9, tipDepth: 3, bloom: 1.2, exposure: 1.05,
    palette: ['#ff3cbe', '#c946ff', '#6a50ff', '#36c2ff', '#6a50ff', '#c946ff', '#ff3cbe'] },
};
const params = new URLSearchParams(location.search);
let variant = VARIANTS[params.get('v')] ? params.get('v') : 'river';
const lite = params.get('lite') === '1';

// Synthetic topology: indexes are first-parent main commits, oldest first.
const MAIN = 26;
const BRANCHES = [
  { name: 'feat/checkout-guard', fork: 3, commits: 4, merge: 9, side: -1 },
  { name: 'fix/free-order-total', fork: 7, commits: 2, merge: 12, side: 1 },
  { name: 'feat/turn-ledger', fork: 14, commits: 5, side: -1 },
  { name: 'spike/map-orbit', fork: 18, commits: 3, side: 1 },
];
const MESSAGES = ['Add checkout guard', 'Count free orders', 'Fix missing-total', 'Test LAUNCH100', 'Refactor totals', 'Ledger line', 'Map orbit spike', 'Docs: status', 'Bump version', 'Tidy imports'];

// ── deterministic noise ─────────────────────────────────────────────────────────────────────────────────────────
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── layout: x is order (oldest left), y follows one broad arc; branches ride beside it ─────────────────────────────
function layout(W, H) {
  const x0 = W * .08, x1 = W * .9, dx = (x1 - x0) / (MAIN - 1), cy = H * .52, arc = H * .1;
  const mainY = (x) => cy - arc * Math.sin(Math.PI * (x - x0 + W * .1) / (x1 - x0 + W * .25)) + H * .02 * Math.sin(x / W * 2.1);

    const xf = x0 + b.fork * dx, xm = b.merge !== undefined ? x0 + b.merge * dx : undefined;
    const xh = xm ?? xf + (b.commits + .4) * dx * .95;
    const lane = 58 + (k >> 1) * 20 + b.commits * 7;
    // A merged branch arches out of the rim and back into it; an unmerged one leaves the rim and drifts outward to its head.
    const lift = (x) => xm !== undefined ? Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, (x - xf) / (xm - xf)))), .7)
      : smooth(xf, xf + (b.commits + 1) * dx * .75, x) * (1 + .08 * (x - xf) / dx);
    const rim = b.side * VARIANTS[variant].width * .45;
    const centre = (x) => mainY(x) + rim + b.side * lane * lift(x);
    const span = (xm ?? xh) - xf;
    for (let c = 1; c <= b.commits; c++) {
      const x = xm !== undefined ? xf + span * c / (b.commits + 1) : xf + dx * .95 * (c + .4) - (c === b.commits ? 0 : 0);
      commits.push({ id: `b${k}c${c}`, x, y: centre(x), strand: k + 1, message: MESSAGES[(k * 3 + c) % MESSAGES.length], branch: b.name, head: xm === undefined && c === b.commits });
    }
    const head = commits.at(-1);
    if (xm === undefined) refs.push({ text: b.name, commit: head, below: b.side > 0 });
    return { ...b, k: k + 1, xf, xm, xh: xm === undefined ? head.x : xm, centre, width: Math.min(VARIANTS[variant].width / 2, 9 + b.commits * 3) };

// ── geometry: every filament is a polyline of short additive segments ──────────────────────────────────────────
function build(L, v) {
  const out = [];   // x, y, r, g, b, a, strand

  const scale = lite ? .5 : 1;

  const head = L.commits[MAIN - 1];

  bundle(main, v.width, Math.round(v.main * scale), 0, (t) => smooth(1, .93, t) * (.55 + .45 * smooth(0, .08, t)), 11);
  // Branches peel off the rim at the fork and (when merged) fade back into it.
  for (const s of L.strands) {
    const pts = [];
    const end = s.xm ?? s.xh;
    for (let x = s.xf; x <= end; x += 6) pts.push([x, s.centre(x), .35 + .65 * smooth(s.xf, s.xf + 50, x) * (s.xm !== undefined ? smooth(s.xm, s.xm - 50, x) : 1)]);
    const count = Math.round((30 + s.commits * 18) * scale);

    bundle(pts, s.width, count, s.k, (t) => smooth(0, .08, t) * (s.xm !== undefined ? smooth(1, .9, t) : 1), 100 + s.k, .04 * s.k);

  function tips(s, pts, count) {
    const r = rng(500 + s.k), last = pts.at(-1), prev = pts.at(-4);
    const grow = (x, y, angle, length, width, n, depth) => {
      const kids = depth === v.tipDepth ? 3 : 2 + (r() < .5 ? 1 : 0);
      for (let k = 0; k < kids; k++) {
        const a = angle + (k - (kids - 1) / 2) * (.42 + r() * .25) + (r() - .5) * .2, len = length * (.7 + r() * .5);
        const path = [[x, y, 1]];
        const steps = 4 + Math.floor(r() * 3);
        let cx = x, cy = y, ca = a;
        for (let i = 1; i <= steps; i++) { ca += (r() - .5) * (.5 + (v.tipDepth - depth) * .2); cx += Math.cos(ca) * len / steps; cy += Math.sin(ca) * len / steps; path.push([cx, cy, 1 - i / steps * .7]); }

        bundle(dense, width, Math.max(5, Math.round(n)), s.k, (t) => (1 - t * .85) * 1.6, 900 + depth * 31 + k * 7 + s.k);
        sparks.push([cx, cy, .35 + r() * .35]);
        if (depth > 1) grow(cx, cy, ca, len * .62, width * .55, n * .45, depth - 1);
      }
    };
    grow(last[0], last[1], Math.atan2(last[1] - prev[1], last[0] - prev[0]), 70, s.width * .55, count * .4, v.tipDepth);

// ── WebGL2: light into half-float, bloom, tone map ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('light');
const gl = canvas.getContext('webgl2', { antialias: true, premultipliedAlpha: false });
const half = gl && gl.getExtension('EXT_color_buffer_float');
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

const QUAD = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * .5 + .5; gl_Position = vec4(p, 0, 1); }`;
const lineProgram = program(`#version 300 es
in vec2 pos; in vec4 col; in float strand; uniform vec2 size; uniform float focus; uniform float focusMix; out vec4 c;
void main(){ float k = focus < 0. ? 1. : (abs(strand - focus) < .5 ? 1.6 : .5); c = vec4(col.rgb, col.a * mix(1., k, focusMix));
  gl_Position = vec4(pos / size * 2. - 1., 0, 1); gl_Position.y *= -1.; }`, `#version 300 es
precision highp float; in vec4 c; out vec4 o; void main(){ o = vec4(c.rgb * c.a, 1); }`);
const pointProgram = program(`#version 300 es
in vec2 pos; in vec4 col; in float sz; uniform vec2 size; uniform float dpr; out vec4 c;
void main(){ c = col; gl_PointSize = sz * dpr; gl_Position = vec4(pos / size * 2. - 1., 0, 1); gl_Position.y *= -1.; }`, `#version 300 es
precision highp float; in vec4 c; out vec4 o;
void main(){ float d = length(gl_PointCoord - .5) * 2.; float core = smoothstep(.35, 0., d), halo = exp(-d * d * 5.) * .35; o = vec4(c.rgb * c.a * (core + halo), 1); }`);
const blurProgram = program(QUAD, `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D src; uniform vec2 step; out vec4 o;
void main(){ vec3 s = texture(src, uv).rgb * .227; float w[4] = float[](.194, .121, .054, .016);
  for (int i = 1; i < 5; i++) { s += (texture(src, uv + step * float(i)).rgb + texture(src, uv - step * float(i)).rgb) * w[i - 1]; } o = vec4(s, 1); }`);
const finalProgram = program(QUAD, `#version 300 es
precision highp float; in vec2 uv; uniform sampler2D sharp, b1, b2, b3; uniform float bloom, exposure; uniform vec2 aspect; out vec4 o;
float blob(vec2 p, vec2 c, float r){ p = (p - c) * aspect; return exp(-dot(p, p) / (r * r)); }
void main(){ vec3 light = texture(sharp, uv).rgb + bloom * (texture(b1, uv).rgb * .55 + texture(b2, uv).rgb * .75 + texture(b3, uv).rgb * .9);
  vec3 nebula = vec3(.16, .08, .3) * blob(uv, vec2(.32, .62), .32) + vec3(.03, .14, .22) * blob(uv, vec2(.74, .38), .28);
  vec3 c = vec3(.012, .016, .035) + nebula * .09 + (1. - exp(-light * exposure));
  o = vec4(pow(c, vec3(.92)), 1); }`);

let L, geometry, lineBuffer, lineCount = 0, pointBuffer, pointCount = 0, targets = [], dpr = 1, focus = -1, focusMix = 0;
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
function target(w, h) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, half ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, half ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

  const r = rng(Array.from('drishya-dev/drishya').reduce((a, ch) => a * 31 + ch.charCodeAt(0) | 0, 7)), out = [];

function setup() {

  L = layout(W, H); geometry = build(L, VARIANTS[variant]);
  lineBuffer ??= gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lineBuffer); gl.bufferData(gl.ARRAY_BUFFER, geometry.lines, gl.STATIC_DRAW); lineCount = geometry.lines.length / 7;

function pass(prog, to, uniforms) {

function draw() {

  gl.bindFramebuffer(gl.FRAMEBUFFER, sharp.fb); gl.viewport(0, 0, sharp.w, sharp.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(gl.getUniformLocation(lineProgram, 'size'), W, H); gl.uniform1f(gl.getUniformLocation(lineProgram, 'focus'), focus); gl.uniform1f(gl.getUniformLocation(lineProgram, 'focusMix'), focusMix);

  attrib(pointProgram, 'pos', 2, 28, 0); attrib(pointProgram, 'col', 4, 28, 8); attrib(pointProgram, 'sz', 1, 28, 24);
  gl.uniform2f(gl.getUniformLocation(pointProgram, 'size'), W, H); gl.uniform1f(gl.getUniformLocation(pointProgram, 'dpr'), dpr);

  const bloom = lite ? 0 : v.bloom;
