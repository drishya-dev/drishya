  if(o.k=='read'){const v=f.v[f.c];t=bn(o.f);s=`lines ${o.hl[0]+1}–${o.hl[1]+1} of ${v.length}`;h=v.map((x,i)=>L(i+1,hi(x),i>=o.hl[0]&&i<=o.hl[1]?'hl':'dim',i)).join('');for(let i=o.hl[0];i<=o.hl[1];i++)f.rd.add(v[i])}
  else if(o.k=='grep'){t='“'+o.q+'”';s=o.res.length+' matches';h=o.res.map((r,i)=>`<div class="l g" data-f="${r[0]}" style="--i:${i}"><b>${r[1]}</b><span><u>${r[0]}</u>${hi(r[2]).replace(o.q,'<mark>$&</mark>')}</span></div>`).join('')}
  else if(o.k=='mcp'){t=o.s+'.'+o.fn;s=o.args;h=JSON.stringify(o.res,null,2).split('\n').map((x,i)=>L('',hi(x),'',i)).join('')}
  else if(o.k=='edit'){const d=diff(f.v[f.c],f.v[o.to]),g=fold(d);f.c=o.to;f.ed=1;t=bn(o.f);s=`+${cnt(d,'+')} −${cnt(d,'-')}`;h=g.map((x,i)=>Array.isArray(x)?L('⋯',x[1],'fold',i):L(x[0]==' '?'':x[0]=='+'?'+':'−',hi(x.slice(1)),x[0]=='+'?'add':x[0]=='-'?'del':'',i)).join('')}
  else{t=o.cmd;s=`exit ${o.exit} · ${o.sec}s`;const n=o.tests.length;h=`<div class="bar">${o.tests.map(x=>`<i class="${x[1]?'':'f'}"></i>`).join('')}</div>`+o.tests.map((x,i)=>L(x[1]?'✓':'✗',E(x[0])+(x[2]?`<em>${E(x[2])}</em>`:''),x[1]?'ok':'bad',i)).join('')+L('',`${o.tests.filter(x=>x[1]).length}/${n} passed`,'sum',n)}
  return `<section class="op ${o.k}${o.exit?' fail':''}" style="--c:${COL[o.k]}"><div class="oh"><u>${IC[o.k]}</u><b>${t}</b><em>${s}</em>${o.f?`<a data-f="${o.f}">open ↗</a>`:''}<s></s></div><div class="bd"><div>${h}</div></div></section>`}
const kd=e=>e.ty!='group'?e.ty:e.ops.some(o=>o.k=='edit')?'edit':e.ops.some(o=>o.exit)?'fail':e.ops.some(o=>o.k=='sh')?'pass':e.ops.some(o=>o.k=='mcp')?'mcp':'read';
const lab=e=>e.ty=='group'?e.ops.map(o=>o.f?bn(o.f):o.k=='grep'?'search '+o.q:o.k=='mcp'?o.s+'.'+o.fn:o.cmd).join(' · '):e.ty=='user'?'Prompt':e.ty=='think'?'Reasoning · '+e.x.slice(0,34)+'…':'Reply';
const st=e=>{const o=e.ops&&e.ops[0];return !o?(e.ty=='think'?'reasoning':e.ty=='reply'?'idle':'listening'):({read:'reading ',grep:'searching ',mcp:'calling ',edit:'editing ',sh:'running '})[o.k]+(o.f?bn(o.f):o.q||o.fn||o.cmd)};
let spd=1,paused=false,run=0,follow=true,rendered=0,tk=0,sec=0,lock=0,PL=[0,0,0,0],done=false;
function render(i){const e=EV[i];let h;
  if(e.ty=='user')h=`<div class="user"><div class="eb">You</div><p>${E(e.x)}</p></div>`;
  else if(e.ty=='think')h=`<div class="think"><div class="eb"><s></s>Reasoning</div><p>${e.x.split(' ').map((w,j)=>`<span style="--i:${j}">${E(w)} </span>`).join('')}</p></div>`;
  else if(e.ty=='reply'){const d=Object.keys(F).filter(p=>F[p].c);h=`<div class="reply"><div class="eb">claude · reply</div><p>${E(e.x)}</p><div class="chips"><button class="pill on" data-t="chg">${d.length} file changed · review</button><button class="pill" id="rp">↻ replay</button></div></div>`}
  else h=`<div class="gh" style="--c:${AG[e.ag||'claude'].c}"><i></i>${AG[e.ag||'claude'].n}<em>${e.ops.length>1?e.ops.length+' actions in parallel':'1 action'}</em></div><div class="grp">${e.ops.map(op).join('')}</div>`;
  const d=document.createElement('div');d.className='ev'+(e.ty=='group'?' g':'');d.dataset.ev=i;d.dataset.k=kd(e);d.innerHTML=h;$('#stream').append(d);
  $$('.ev.g').slice(0,-1).forEach(x=>x.querySelectorAll('.op:not(.keep)').forEach(o=>o.classList.add('shut')))}
function tween(n){const a=tk,t0=performance.now();tk+=n;(function f(t){const p=Math.min(1,(t-t0)/900);$('#tk').textContent=Math.round(a+(tk-a)*p).toLocaleString();$('#cost').textContent='$'+((a+(tk-a)*p)*.000015).toFixed(3);if(p<1)requestAnimationFrame(f)})(t0);$('#cr').setAttribute('stroke-dashoffset',100-Math.min(95,22+tk/70))}
function apply(i){const e=EV[i],ex=e.ag=='explore';render(i);rendered=i+1;(e.pl||[]).forEach(([a,b])=>PL[a]=b);
  if(ex)$('#pex').classList.add('on');
  $('#pcl').classList.toggle('busy',!ex&&e.ty!='reply'&&e.ty!='user');$('#pex').classList.toggle('busy',ex);$(ex?'#sex':'#scl').textContent=st(e);if(!ex&&$('#pex').classList.contains('on'))$('#sex').textContent='done';
  (e.ops||[]).forEach(o=>{if(o.f)glow(o.f,o.k=='edit'?2:1);if(o.k=='grep')o.res.forEach(r=>glow(r[0],1));if(o.k=='sh'){F[TN].ran=o.exit?'x':'p';glow(TN,o.exit?3:1)}});
  if(e.ty=='reply')done=true;
  tween(e.tk||0);dock();marks();if(follow){lock=performance.now()+900;requestAnimationFrame(()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'}))}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms/spd));
async function play(){const my=++run;reset();for(let i=0;i<EV.length;i++){while(paused&&my===run)await new Promise(r=>setTimeout(r,120));if(my!==run)return;apply(i);await sleep(EV[i].d)}$('#play').textContent='↻'}
function reset(){$('#stream').innerHTML='';for(const p in F)Object.assign(F[p],{c:0,rd:new Set,ed:0,ran:''});PL=[0,0,0,0];rendered=0;tk=0;sec=0;done=false;follow=true;paused=false;$('#play').textContent='❚❚';$('#tk').textContent=0;$('#cost').textContent='$0.000';$('#cr').setAttribute('stroke-dashoffset',80);$('#pex').classList.remove('on','busy');$('#scl').textContent='idle';N.forEach(n=>n.g=n.e=n.f=0);scrollTo(0,0);dock();marks();$('#vw').classList.remove('on')}
function dock(){$('#tree').innerHTML=Object.keys(F).map(p=>{const f=F[p],s=f.ran=='x'?'x':f.ed?'e':f.ran=='p'?'p':f.rd.size?'r':'';return `<button class="fi ${s}" data-f="${p}"><i></i><span><u>${p.replace(/[^/]*$/,'')}</u>${bn(p)}</span><em>${{x:'failing',e:'edited',p:'passing',r:'read'}[s]||''}</em></button>`}).join('');
  $('#plan').innerHTML=PLN.map((t,i)=>`<div class="pi s${PL[i]}"><i></i>${t}</div>`).join('');
  const c=Object.keys(F).filter(p=>F[p].c);$('#chg').innerHTML=c.length?c.map(p=>{const d=diff(F[p].v[0],F[p].v[F[p].c]);return `<div class="ch" data-f="${p}"><span>${p}</span><em><b class="pl">+${cnt(d,'+')}</b> <b class="mi">−${cnt(d,'-')}</b></em></div>`}).join(''):'<p class="mute">No changes yet. This is a live git diff of what the agent touched.</p>'}
function view(p){const f=F[p];$('body').classList.add('dk');$('#vt').textContent=p;const v=f.v&&f.v[f.c||0];$('#vb').innerHTML=v?v.map((x,i)=>L(i+1,hi(x),(f.v[0].includes(x)?'':'add ')+(f.rd.has(x)?'hl':''))).join(''):'<p class="mute">Not touched in this session.</p>';$('#vw').classList.add('on')}
function marks(){$('#track').querySelectorAll('.mk').forEach(m=>m.classList.toggle('on',+m.dataset.i<rendered));$('#ph').style.width=(rendered?(rendered-1)/(EV.length-1)*100:0)+'%'}
const KC={user:'#ececee',think:'var(--mcp)',read:'var(--read)',edit:'var(--edit)',fail:'var(--bad)',pass:'var(--ok)',mcp:'var(--mcp)',reply:'var(--gold)'};
$('#track').insertAdjacentHTML('beforeend',EV.map((e,i)=>`<button class="mk ${kd(e)}" data-i="${i}" title="${E(lab(e))}" style="left:${i/(EV.length-1)*100}%;--c:${KC[kd(e)]}"></button>`).join(''));
function jump(i){const el=$(`[data-ev="${i}"]`);if(!el)return;follow=false;lock=performance.now()+900;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl')}
function nx(k,d){const els=$$(`.ev[data-k~="${k}"]`),y=scrollY+innerHeight/2,t=d>0?els.find(x=>x.offsetTop>y+30):els.reverse().find(x=>x.offsetTop<y-30);if(t)jump(+t.dataset.ev)}
function step(d){const y=scrollY+innerHeight/2,els=$$('.ev'),t=d>0?els.find(x=>x.offsetTop>y+30):els.reverse().find(x=>x.offsetTop<y-30);if(t)jump(+t.dataset.ev)}
const pz=()=>{if(done){play();return}paused=!paused;$('#play').textContent=paused?'▶':'❚❚'};
let gOn=true;const tg=()=>{gOn=!gOn;$('#bg').style.opacity=gOn?1:0;$('#bg2').classList.toggle('on',gOn)},td=()=>{$('body').classList.toggle('dk');$('#bd').classList.toggle('on')};
let sel=0,its=[];
function pal(o){$('#pal').classList.toggle('on',o);if(o){$('#pi').value='';pf();$('#pi').focus()}}
function pf(){const q=$('#pi').value.toLowerCase();its=[...EV.slice(0,rendered).map((e,i)=>({t:lab(e),h:'jump',f:()=>jump(i)})),...Object.keys(F).map(p=>({t:p,h:'open file',f:()=>view(p)})),{t:'Toggle repo graph',h:'G',f:tg},{t:'Toggle files dock',h:'D',f:td},{t:'Pause / resume',h:'Space',f:pz},{t:'Replay session',h:'',f:play}].filter(x=>x.t.toLowerCase().includes(q)).slice(0,9);sel=0;ps()}
function ps(){$('#pr').innerHTML=its.map((x,i)=>`<button class="${i==sel?'sel':''}" data-i="${i}">${E(x.t)}<em>${x.h}</em></button>`).join('')}
$('#pi').oninput=pf;$('#pi').onkeydown=e=>{if(e.key=='ArrowDown'){sel=Math.min(sel+1,its.length-1);ps();e.preventDefault()}else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);ps();e.preventDefault()}else if(e.key=='Enter'&&its[sel]){pal(0);its[sel].f()}else if(e.key=='Escape')pal(0)};
$('#pr').onclick=e=>{const b=e.target.closest('button');if(b){pal(0);its[+b.dataset.i].f()}};$('#pal').onclick=e=>{if(e.target.id=='pal')pal(0)};
document.addEventListener('click',e=>{const a=e.target.closest('[data-f]');if(a){view(a.dataset.f);e.stopPropagation();return}
  const h=e.target.closest('.oh');if(h){const o=h.parentNode;o.classList.toggle('shut');o.classList.add('keep');return}
  const t=e.target.closest('[data-t]');if(t){$('body').classList.add('dk');$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t.dataset.t));$$('.pane').forEach(p=>p.classList.toggle('on',p.id==t.dataset.t));$('#vw').classList.remove('on');return}
  const m=e.target.closest('.mk');if(m){jump(+m.dataset.i);return}if(e.target.id=='rp')play()});
$('#vx').onclick=()=>$('#vw').classList.remove('on');$('#play').onclick=pz;$('#bg2').onclick=tg;$('#bd').onclick=td;$('#bk').onclick=()=>pal(1);
$('#spd').onchange=e=>{spd=+e.target.value;document.documentElement.style.setProperty('--k',1/spd)};
$('#live').onclick=()=>{follow=true;lock=performance.now()+900;scrollTo({top:document.body.scrollHeight,behavior:'smooth'});$('#live').classList.remove('show')};
addEventListener('scroll',()=>{if(performance.now()<lock)return;follow=innerHeight+scrollY>=document.body.scrollHeight-220;$('#live').classList.toggle('show',!follow&&!done&&rendered>0)},{passive:true});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();pal(!$('#pal').classList.contains('on'));return}if(e.target.tagName=='INPUT')return;const k=e.key.toLowerCase();
  if(k==' '){e.preventDefault();pz()}else if(k=='e')nx('edit',e.shiftKey?-1:1);else if(k=='f')nx('fail',e.shiftKey?-1:1);else if(k=='j')step(1);else if(k=='k')step(-1);else if(k=='g')tg();else if(k=='d')td();else if(k=='/'){e.preventDefault();pal(1)}else if(k=='escape')$('#vw').classList.remove('on')});
setInterval(()=>{if(!paused&&!done&&rendered){sec+=spd;$('#tm').textContent=Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0')}},1000);
/* ambient repo graph */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,N=[];
const POS={'src/auth/refresh.ts':[.5,.3],'src/api/retry.ts':[.66,.52],[TN]:[.4,.74],'src/api/client.ts':[.3,.42],'src/auth/store.ts':[.2,.62],'package.json':[.78,.2]};
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;N=[];for(const p in POS)N.push({p,x:POS[p][0]*W,y:POS[p][1]*H,vx:0,vy:0,g:0,e:0,f:0,r:3});for(let i=0;i<34;i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,g:0,e:0,f:0,r:1.6})}
function glow(p,t){const n=N.find(n=>n.p===p);if(!n)return;n.g=1;if(t==2)n.e=1;if(t==3)n.f=1;if(t==1)n.f=0}
function draw(){cx.clearRect(0,0,W,H);for(const a of N){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;a.g*=.994}
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<190){const g=Math.max(a.g,b.g);cx.strokeStyle=`rgba(${g>.25?'143,180,217':'255,255,255'},${(1-d/190)*(.05+g*.45)})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
  for(const a of N){const c=a.f?'255,123,134':a.e?'230,185,138':a.p?'143,180,217':'255,255,255';cx.fillStyle=`rgba(${c},${Math.min(1,.2+a.g*.8+(a.e||a.f?.4:0))})`;cx.beginPath();cx.arc(a.x,a.y,a.r+a.g*4,0,7);cx.fill();if(a.p&&(a.g>.05||a.e||a.f)){cx.font='11px ui-monospace,monospace';cx.fillStyle=`rgba(${c},${.4+a.g*.55})`;cx.fillText(bn(a.p),a.x+11,a.y+4)}}
  requestAnimationFrame(draw)}
addEventListener('resize',rs);rs();draw();play();
